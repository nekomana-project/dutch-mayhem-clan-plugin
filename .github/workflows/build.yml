# Builds the plugin on every pull request and on every push to main, so a change (or a new RuneLite release,
# the build uses `latest.release`) that breaks compiling is seen at once. Read-only: no secrets, nothing deployed.
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Compile
        run: sh ./gradlew --no-daemon compileJava compileTestJava
